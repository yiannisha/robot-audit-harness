[project]
name = "boundary-audit"
version = "0.1.0"
description = "Differential network-behavior auditing for black-box IoT and robotic devices."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["pydantic>=1.10,<3", "PyYAML>=6.0", "typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
boundary-audit = "boundary_audit.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
disallow_untyped_defs = true
